name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed for softprops/action-gh-release to publish

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Web tests first — if these fail there's no point building an APK.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run web tests
        run: npm test

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: myhabits-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # On main, publish a rolling pre-release so the APK has a stable URL.
      # We delete-and-recreate (instead of updating in place) so the "published"
      # timestamp + the release name reflect the current build, not the first one.
      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          NAME="Build $SHORT_SHA · $DATE"

          # Remove the previous release with the same tag so the timestamp updates.
          gh release delete latest --yes --cleanup-tag || true

          gh release create latest \
            --prerelease \
            --title "$NAME" \
            --notes "Latest debug build from \`main\` (commit \`${{ github.sha }}\`).

          Install on your phone: download \`app-debug.apk\`, open it from the
          Files app, allow \"Install from unknown sources\" if prompted." \
            "${{ steps.apk.outputs.path }}"
