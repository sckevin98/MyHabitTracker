<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="flameOuter" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="0.55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.6" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background — maskable cropping clips to whatever shape the launcher uses. -->
  <rect width="512" height="512" fill="#0b0c0e"/>
  <!-- Flame sized to live inside the maskable safe zone (inner ~80%). -->
  <path fill="url(#flameOuter)" d="M 256 96
        C 296 154, 352 212, 352 290
        C 352 360, 304 420, 256 420
        C 208 420, 160 360, 160 290
        C 160 212, 216 154, 256 96 Z"/>
  <path fill="url(#flameInner)" d="M 256 252
        C 280 274, 304 304, 296 344
        C 288 384, 264 400, 256 400
        C 248 400, 224 384, 216 344
        C 208 304, 232 274, 256 252 Z"/>
</svg>
